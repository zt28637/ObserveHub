global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'dingtalk-webhook'
  
  routes:
    - match:
        severity: critical
      receiver: 'dingtalk-critical'
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 10m
      continue: true
    
    - match:
        severity: warning
      receiver: 'dingtalk-warning'
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 30m

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['instance', 'alertname']

receivers:
  - name: 'dingtalk-webhook'
    webhook_configs:
      - url: 'http://webhook-dingtalk:8060/dingtalk/webhook1/send'
        send_resolved: true
        max_alerts: 10
  
  - name: 'dingtalk-critical'
    webhook_configs:
      - url: 'http://webhook-dingtalk:8060/dingtalk/webhook1/send'
        send_resolved: true
        max_alerts: 10
  
  - name: 'dingtalk-warning'
    webhook_configs:
      - url: 'http://webhook-dingtalk:8060/dingtalk/webhook1/send'
        send_resolved: true
        max_alerts: 10
