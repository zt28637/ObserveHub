<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云原生可观测平台</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .link-btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            text-align: left;
        }
        .info h3 {
            margin-top: 0;
            color: #667eea;
        }
        .info p {
            margin: 5px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>云原生可观测平台</h1>
        <p class="subtitle">Cloud Native Observability Platform</p>
        
        <div class="links">
            <a href="/grafana/" class="link-btn">📊 Grafana 可视化平台</a>
            <a href="/prometheus/" class="link-btn">📈 Prometheus 监控系统</a>
            <a href="/alertmanager/" class="link-btn">🚨 Alertmanager 告警管理</a>
        </div>
        
        <div class="info">
            <h3>平台信息</h3>
            <p><strong>版本:</strong> v1.0</p>
            <p><strong>技术栈:</strong> Docker + Prometheus + Loki + Grafana</p>
            <p><strong>部署时间:</strong> 2026-03-29</p>
            <p><strong>访问地址:</strong> http://192.168.213.142</p>
        </div>
    </div>
</body>
</html>
